name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: local_dev_password_change_me
          POSTGRES_DB: knowledge_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize PostgreSQL Schema
        env:
          PGPASSWORD: local_dev_password_change_me
        run: |
          psql -h localhost -U raguser -d knowledge_copilot -f app/db/schema.sql

      - name: Run Test Suite (67+ Tests & Security Suites)
        env:
          DATABASE_URL: postgresql://raguser:local_dev_password_change_me@localhost:5432/knowledge_copilot
          OLLAMA_BASE_URL: http://localhost:11434
          EMBEDDING_MODEL: nomic-embed-text
          GENERATION_MODEL: qwen3:4b
          FAST_GENERATION_MODEL: qwen2.5-coder:1.5b
          PYTHONPATH: .
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml -v

      - name: Run Evaluation Retrieval Smoke Test
        env:
          DATABASE_URL: postgresql://raguser:local_dev_password_change_me@localhost:5432/knowledge_copilot
          OLLAMA_BASE_URL: http://localhost:11434
          PYTHONPATH: .
        run: |
          python -c "from app.retrieval.retriever import retrieve_chunks; print('Retriever smoke test passed')"

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Multi-Stage Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: enterprise-knowledge-copilot:ci
